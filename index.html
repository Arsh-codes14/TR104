<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        /* ============================================
           MODERN GRADIENT THEME - CLOUD & SKY INSPIRED
        ============================================ */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        :root {
            /* Sky & Cloud Color Palette */
            --bg-primary: #0a1128;
            --bg-secondary: #1a2332;
            --bg-tertiary: #132038;
            --accent-sky: #3b82f6;
            --accent-cloud: #60a5fa;
            --accent-air: #06b6d4;
            --accent-weather: #8b5cf6;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-dim: #94a3b8;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, var(--bg-tertiary) 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background effect */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 25% 35%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 75% 65%, rgba(139, 92, 246, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.1) 0%, transparent 60%);
            animation: cloudMove 25s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes cloudMove {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.05); }
            66% { transform: translate(-25px, 30px) scale(0.98); }
        }

        /* Floating particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(96, 165, 250, 0.4);
            border-radius: 50%;
            animation: particleFloat 20s infinite;
        }

        @keyframes particleFloat {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-120vh) translateX(60px); opacity: 0; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        /* ============================================
           HEADER
        ============================================ */
        .header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 0.8s ease-out;
        }

        .company-badge {
            display: inline-block;
            padding: 10px 24px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(6, 182, 212, 0.2));
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent-sky);
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: clamp(2.2rem, 5vw, 3.8rem);
            font-weight: 800;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 50%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 1.15rem;
            color: var(--text-secondary);
            margin-bottom: 25px;
            font-weight: 400;
        }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
            max-width: 700px;
            margin: 0 auto;
        }

        .stat-item {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-sky), var(--accent-air));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: block;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 500;
        }

        /* ============================================
           MONTH SECTION
        ============================================ */
        .month-section {
            margin-bottom: 25px;
        }

        .month-button {
            width: 100%;
            padding: 25px 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            color: var(--text-primary);
            font-size: 1.3rem;
            font-weight: 700;
            text-align: left;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .month-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .month-button:hover::before {
            left: 100%;
        }

        .month-button:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent-sky);
            transform: translateX(5px);
            box-shadow: 0 10px 40px rgba(59, 130, 246, 0.3);
        }

        .month-button.active {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(6, 182, 212, 0.15));
            border-color: var(--accent-sky);
            box-shadow: 0 5px 30px rgba(59, 130, 246, 0.4);
        }

        .month-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 1;
        }

        .month-name {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .month-dates {
            font-size: 0.9rem;
            color: var(--text-dim);
            font-weight: 400;
        }

        .month-arrow {
            font-size: 1.8rem;
            transition: transform 0.3s ease;
            z-index: 1;
            color: var(--accent-sky);
        }

        .month-button.active .month-arrow {
            transform: rotate(90deg);
        }

        /* ============================================
           WEEKS CONTAINER
        ============================================ */
        .weeks-container {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease;
            opacity: 0;
            margin-top: 20px;
        }

        .weeks-container.show {
            max-height: 6000px;
            opacity: 1;
        }

        .week-item {
            margin-bottom: 15px;
        }

        .week-button {
            width: 100%;
            padding: 20px 25px;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.1), rgba(139, 92, 246, 0.1));
            backdrop-filter: blur(15px);
            border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: 16px;
            color: var(--text-primary);
            font-size: 1.05rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .week-button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 4px;
            height: 0;
            background: linear-gradient(180deg, var(--accent-air), var(--accent-weather));
            border-radius: 0 4px 4px 0;
            transition: height 0.3s ease;
            transform: translateY(-50%);
        }

        .week-button:hover::after {
            height: 60%;
        }

        .week-button:hover {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.15), rgba(139, 92, 246, 0.15));
            border-color: var(--accent-air);
            transform: translateX(8px);
            box-shadow: 0 8px 25px rgba(6, 182, 212, 0.3);
        }

        .week-button.active {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(139, 92, 246, 0.2));
            border-color: var(--accent-air);
            box-shadow: 0 5px 20px rgba(6, 182, 212, 0.4);
        }

        .week-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .week-label {
            font-size: 0.8rem;
            color: var(--accent-air);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
        }

        .week-range {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .week-arrow {
            font-size: 1.3rem;
            transition: transform 0.3s ease;
            color: var(--accent-air);
        }

        .week-button.active .week-arrow {
            transform: rotate(90deg);
        }

        /* ============================================
           DAYS CONTAINER
        ============================================ */
        .days-container {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.4s ease;
            opacity: 0;
            margin-top: 15px;
            padding-left: 15px;
        }

        .days-container.show {
            max-height: 4000px;
            opacity: 1;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .day-button {
            padding: 18px;
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.1), rgba(139, 92, 246, 0.1));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(96, 165, 250, 0.2);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .day-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.2), rgba(139, 92, 246, 0.2));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .day-button:hover::before {
            opacity: 1;
        }

        .day-button:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: var(--accent-cloud);
            box-shadow: 0 10px 30px rgba(96, 165, 250, 0.4);
        }

        .day-number {
            font-size: 0.75rem;
            color: var(--accent-cloud);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
            z-index: 1;
        }

        .day-date {
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 500;
            z-index: 1;
        }

        /* ============================================
           FOOTER
        ============================================ */
        .footer {
            text-align: center;
            margin-top: 80px;
            padding: 40px 20px;
            border-top: 1px solid var(--glass-border);
            color: var(--text-dim);
        }

        .footer-text {
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .footer-highlight {
            background: linear-gradient(135deg, var(--accent-sky), var(--accent-air));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        /* ============================================
           ANIMATIONS
        ============================================ */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================
           RESPONSIVE
        ============================================ */
        @media (max-width: 768px) {
            .container {
                padding: 30px 15px;
            }

            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .stat-number {
                font-size: 2rem;
            }

            .month-button {
                padding: 20px 20px;
            }

            .month-name {
                font-size: 1.1rem;
            }

            .week-button {
                padding: 18px 20px;
                font-size: 0.95rem;
            }

            .days-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .days-container {
                padding-left: 10px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }

            .stats {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .month-button {
                padding: 18px 18px;
            }

            .days-grid {
                grid-template-columns: 1fr;
            }
        }

        html {
            scroll-behavior: smooth;
        }

        ::selection {
            background: rgba(59, 130, 246, 0.3);
            color: var(--text-primary);
        }
    </style>
</head>

                            date: `2025-12-${String(i + 1).padStart(2, '0')}` 
                        }))
                    },
                    { 
                        name: "Week 20", 
                        range: "Dec 5-11",
                        days: Array.from({length: 7}, (_, i) => ({ 
                            day: `Day ${136 + i}`, 
                            date: `2025-12-${String(i + 5).padStart(2, '0')}` 
                        }))
                    },
                    { 
                        name: "Week 21", 
                        range: "Dec 12-18",
                        days: Array.from({length: 7}, (_, i) => ({ 
                            day: `Day ${143 + i}`, 
                            date: `2025-12-${String(i + 12).padStart(2, '0')}` 
                        }))
                    },
                    { 
                        name: "Week 22", 
                        range: "Dec 19-25",
                        days: Array.from({length: 7}, (_, i) => ({ 
                            day: `Day ${150 + i}`, 
                            date: `2025-12-${String(i + 19).padStart(2, '0')}` 
                        }))
                    },
                    { 
                        name: "Week 23", 
                        range: "Dec 26-31",
                        days: Array.from({length: 6}, (_, i) => ({ 
                            day: `Day ${157 + i}`, 
                            date: `2025-12-${String(i + 26).padStart(2, '0')}` 
                        }))
                    }
                ]
            }
        ];

        // ============================================
        // RENDER FUNCTIONS
        // ============================================
        
        function renderMonths() {
            const container = document.getElementById('monthsContainer');
            
            internshipData.forEach((monthData, monthIndex) => {
                const monthSection = document.createElement('div');
                monthSection.className = 'month-section';
                monthSection.innerHTML = `
                    <button class="month-button" data-month="${monthIndex}">
                        <div class="month-info">
                            <span class="month-name">${monthData.month}</span>
                            <span class="month-dates">${monthData.dateRange}</span>
                        </div>
                        <span class="month-arrow">›</span>
                    </button>
                    <div class="weeks-container" id="weeks-${monthIndex}">
                        ${renderWeeks(monthData.weeks, monthIndex)}
                    </div>
                `;
                container.appendChild(monthSection);
            });
        }

        function renderWeeks(weeks, monthIndex) {
            return weeks.map((week, weekIndex) => `
                <div class="week-item">
                    <button class="week-button" data-month="${monthIndex}" data-week="${weekIndex}">
                        <div class="week-info">
                            <span class="week-label">${week.name}</span>
                            <span class="week-range">${week.range}</span>
                        </div>
                        <span class="week-arrow">›</span>
                    </button>
                    <div class="days-container" id="days-${monthIndex}-${weekIndex}">
                        ${renderDays(week.days)}
                    </div>
                </div>
            `).join('');
        }

        function renderDays(days) {
            return `
                <div class="days-grid">
                    ${days.map(day => `
                        <a href="${GITHUB_REPO}/${day.date}.md" 
                           target="_blank" 
                           rel="noopener noreferrer"
                           class="day-button">
                            <span class="day-number">${day.day}</span>
                            <span class="day-date">${day.date}</span>
                        </a>
                    `).join('')}
                </div>
            `;
        }

        // ============================================
        // EVENT HANDLERS
        // ============================================
        
        function toggleMonth(monthIndex) {
            const button = document.querySelector(`.month-button[data-month="${monthIndex}"]`);
            const weeksContainer = document.getElementById(`weeks-${monthIndex}`);
            
            document.querySelectorAll('.month-button').forEach(btn => {
                if (btn !== button) btn.classList.remove('active');
            });
            document.querySelectorAll('.weeks-container').forEach(container => {
                if (container !== weeksContainer) container.classList.remove('show');
            });
            
            button.classList.toggle('active');
            weeksContainer.classList.toggle('show');
            
            if (!button.classList.contains('active')) {
                weeksContainer.querySelectorAll('.week-button').forEach(btn => {
                    btn.classList.remove('active');
                });
                weeksContainer.querySelectorAll('.days-container').forEach(container => {
                    container.classList.remove('show');
                });
            }
        }

        function toggleWeek(monthIndex, weekIndex) {
            const button = document.querySelector(`.week-button[data-month="${monthIndex}"][data-week="${weekIndex}"]`);
            const daysContainer = document.getElementById(`days-${monthIndex}-${weekIndex}`);
            const weeksContainer = document.getElementById(`weeks-${monthIndex}`);
            
            weeksContainer.querySelectorAll('.week-button').forEach(btn => {
                if (btn !== button) btn.classList.remove('active');
            });
            weeksContainer.querySelectorAll('.days-container').forEach(container => {
                if (container !== daysContainer) container.classList.remove('show');
            });
            
            button.classList.toggle('active');
            daysContainer.classList.toggle('show');
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        
        document.addEventListener('DOMContentLoaded', () => {
            createParticles();
            renderMonths();
            
            document.getElementById('monthsContainer').addEventListener('click', (e) => {
                const monthButton = e.target.closest('.month-button');
                if (monthButton) {
                    toggleMonth(parseInt(monthButton.dataset.month));
                    return;
                }
                
                const weekButton = e.target.closest('.week-button');
                if (weekButton) {
                    toggleWeek(parseInt(weekButton.dataset.month), parseInt(weekButton.dataset.week));
                    return;
                }
            });
        });
    </script>
</body>
</html>
